name: 객관기후예측 갱신

# EC46 은 매일 20:30 UTC, SEAS5 는 매월 5일 갱신 → 매일 22:10 UTC(07:10 KST) 산출
# GitHub 예약 실행은 지연·누락될 수 있어 07:10 / 08:40 / 12:10 KST 세 번 걸어 두고,
# 그날 07시 이후 발표가 이미 게시돼 있으면 뒤의 예약 실행은 건너뛴다(push·수동 실행은 항상 실행).
# 산출 결과를 포함한 웹사이트 전체를 gh-pages 브랜치에 올린다 (Settings → Pages → Deploy from a branch → gh-pages)
on:
  schedule:
    - cron: "10 22 * * *"
    - cron: "40 23 * * *"
    - cron: "10 3 * * *"
  push:
    paths: ["pipeline/**", "site/**", ".github/workflows/outlook.yml"]
  workflow_dispatch:
    inputs:
      demo:
        description: "합성(DEMO) 자료로 실행"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: outlook
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.chk.outputs.skip }}
    steps:
      - id: chk
        run: |
          skip=false
          if [ "${{ github.event_name }}" = "schedule" ]; then
            issued=$(curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/gh-pages/data/latest/manifest.json" \
                     | python3 -c "import json,sys; print(json.load(sys.stdin)['issued'])" || true)
            today=$(TZ=Asia/Seoul date +%Y-%m-%dT07:00)
            echo "게시된 발표: ${issued:-없음}, 기준: $today"
            if [[ -n "$issued" && "$issued" > "$today" ]]; then skip=true; fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  build:
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r pipeline/requirements.txt
      - name: 전망 산출
        run: python pipeline/outlook.py ${{ inputs.demo && '--demo' || '' }}
      - name: 지난 발표 보관(gh-pages 의 archive 이어받기 + 오늘 발표 추가, 45일 보관)
        run: |
          git clone -q --depth 1 -b gh-pages "https://github.com/${{ github.repository }}.git" /tmp/prev || true
          mkdir -p site/data/archive
          if [ -d /tmp/prev/data/archive ]; then cp -r /tmp/prev/data/archive/. site/data/archive/; fi
          python pipeline/archive.py
      - name: 웹사이트를 gh-pages 브랜치에 게시(단일 커밋, 이력 누적 없음)
        run: |
          set -e
          cp -r site /tmp/pages
          touch /tmp/pages/.nojekyll
          cd /tmp/pages
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "outlook $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
