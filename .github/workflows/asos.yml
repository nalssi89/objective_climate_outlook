name: ASOS 관측 평년 구축

# 지점 상세화용 ASOS 1991–2020 일자료 수집(이어받기). 실패하면 진행분을 커밋하고 다시 실행하면 이어받는다.
on:
  workflow_dispatch:
  push:
    paths: ["pipeline/asos.py", "pipeline/kma.py", "pipeline/fine_grid.py", ".github/workflows/asos.yml"]

permissions:
  contents: write

concurrency:
  group: asos
  cancel-in-progress: false

jobs:
  asos:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r pipeline/requirements.txt
      - name: ASOS 1991–2020 수집
        run: python pipeline/asos.py || echo "미완료 - 다시 실행하면 이어받음"
        env:
          KMA_APIHUB_KEY: ${{ secrets.KMA_APIHUB_KEY }}
      - name: 20 km 상세화 격자 고도(최초 1회)
        run: python pipeline/fine_grid.py elev
      - name: 요약
        run: python pipeline/asos.py --info | head -120
      - name: 캐시 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pipeline/cache/asos_daily.npz site/data/grid_fine.json || true
          git diff --cached --quiet && exit 0
          git commit -m "ASOS 관측 평년 캐시 갱신"
          # 그사이 다른 커밋이 올라왔으면 이 실행의 결과를 우선해 다시 얹는다
          for i in 1 2 3; do git pull --rebase -X theirs -q && git push && break; sleep 5; done
